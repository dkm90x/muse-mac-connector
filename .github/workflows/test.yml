name: test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r agent-requirements.txt -r requirements.txt
      - run: python -m compileall connector mac_agent
      - run: python -m unittest discover -s tests -v
